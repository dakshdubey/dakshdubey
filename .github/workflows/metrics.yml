name: Metrics
on:
  # Schedule daily updates at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
  # Run automatically on main branch commits
  push:
    branches:
      - main
      - master

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: General Metrics & Engineering Habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: dakshdubey
          template: classic
          filename: github-metrics.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_order: base.header, isocalendar, languages, habits, achievements, activity

          # Plugin: Isometric Commit Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Plugin: Most Used & Recent Languages
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          # Plugin: Coding Habits & Activity Trends
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # Plugin: GitHub Achievements
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_limit: 5
          plugin_achievements_display: compact

          # Plugin: Recent Repository Activity
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: all
